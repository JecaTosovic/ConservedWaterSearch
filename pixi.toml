[workspace]
name = "ConservedWaterSearch"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64","linux-aarch64", "win-64"]

[dependencies]
numpy = ">=2.0.0"
matplotlib = "*"
nglview = "*"
# TODO: remove this pin when Python 3.10 support is dropped.
# The py310 Pixi environment currently resolves nglview 3.1.4, which still
# imports pkg_resources. setuptools 82 removed pkg_resources.
setuptools = "<82"
scikit-learn = "*"
pytest = "*"
pip = "*"
uv = "*"
pymol-open-source = "*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py310.dependencies]
python = "3.10.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = { features = ["py311"] }
py310 = { features = ["py310"] }
py311 = { features = ["py311"] }
py312 = { features = ["py312"] }
py313 = { features = ["py313"] }
py314 = { features = ["py314"] }

