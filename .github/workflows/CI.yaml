name: CI

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: [ubuntu-latest]
    steps:
    - name: Checkout Code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        submodules: true
    - name: Create Python Environment
      uses: prefix-dev/setup-pixi@51b98037a96d8c8de9468a767400f984d173fd90
      with:
        pixi-version: v0.54.1
        cache: false
        environments: py311
        activate-environment: true
    - name: Install pre-commit
      run: python -m pip install pre-commit
    - name: Run pre-commit
      run: pre-commit run --all-files

  tests:

    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        include:
          - python: "3.11"
            pixi-env: "py311"
          - python: "3.12"
            pixi-env: "py312"
          - python: "3.13"
            pixi-env: "py313"
          - python: "3.14"
            pixi-env: "py314"

    steps:
    - name: Checkout Code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        submodules: true
    - name: Create Python Environment
      uses: prefix-dev/setup-pixi@51b98037a96d8c8de9468a767400f984d173fd90
      with:
        pixi-version: v0.54.1
        cache: false
        environments: ${{ matrix.pixi-env }}
        activate-environment: true
    - name: Install package
      run: python -m pip install -e .
    - name: Run Tests
      run: pytest tests/ -v

  tests_complete:
    name: All tests
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
    - name: Done
      run: echo "Done."
